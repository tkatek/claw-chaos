<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; background:#222; font:12px monospace; }
  .cell { background:repeating-conic-gradient(#555 0% 25%, #888 0% 50%) 0 0/16px 16px; padding:4px; display:inline-block; }
  .cell span { color:#fff; display:block; background:#000; padding:2px; }
  .wrap { position:relative; display:inline-block; }
  .vgrid { position:absolute; inset:0; background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.30) 0 1px, transparent 1px calc(100%/20)); }
  .lbl { position:absolute; color:#0ff; font:11px monospace; text-shadow:0 0 3px #000; }
</style></head><body>
<!-- photo_b console x .05-.97, y .70-1.0 : 20 bands each = 4.6% art width -->
<div class="cell"><span>photo_b console: art x .05-.97 in 20 bands (each 4.6%), y .70-1.0</span>
  <div class="wrap">
    <div class="crop" style="overflow:hidden;width:1460px;height:485px">
      <img src="../assets/backdrop/photo_b.png" style="width:1587px;position:relative;left:-79px;top:-760px">
    </div>
    <div class="vgrid"></div>
    <div class="lbl" style="left:0;top:0">x .05</div>
    <div class="lbl" style="left:calc(100%/20*3);top:0">.19</div>
    <div class="lbl" style="left:calc(100%/20*5);top:0">.28</div>
    <div class="lbl" style="left:calc(100%/20*8);top:0">.42</div>
    <div class="lbl" style="left:calc(100%/20*10);top:0">.51</div>
    <div class="lbl" style="left:calc(100%/20*13);top:0">.65</div>
    <div class="lbl" style="left:calc(100%/20*16);top:0">.79</div>
    <div class="lbl" style="left:calc(100% - 40px);top:0">.97</div>
  </div>
</div>
</body></html>
