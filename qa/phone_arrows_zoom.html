<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body { margin:0; background:#222; font:12px monospace; }
  .cell { background:repeating-conic-gradient(#555 0% 25%, #888 0% 50%) 0 0/16px 16px; padding:4px; display:inline-block; }
  .cell span { color:#fff; display:block; background:#000; padding:2px; }
  .wrap { position:relative; display:inline-block; }
  .vgrid { position:absolute; inset:0; background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.30) 0 1px, transparent 1px calc(100%/18)); }
  .lbl { position:absolute; color:#0ff; font:11px monospace; text-shadow:0 0 3px #000; }
</style></head><body>
<!-- photo_a yellow panel x .24-.60, y .76-.94 : 18 vertical bands each = 2% of ART width -->
<div class="cell"><span>photo_a arrows panel: art x .24-.60 (18 bands of 2% art), y .76-.94</span>
  <div class="wrap">
    <div class="crop" style="overflow:hidden;width:1440px;height:768px">
      <img src="../assets/backdrop/photo_a.png" style="width:9410px;position:relative;left:-2258px;top:-1270px">
    </div>
    <div class="vgrid"></div>
    <div class="lbl" style="left:0;top:0">art x .24 (band0)</div>
    <div class="lbl" style="left:calc(100%/18*4 - 40px);top:0">.32 (4)</div>
    <div class="lbl" style="left:calc(100%/18*9 - 40px);top:0">.42 (9)</div>
    <div class="lbl" style="left:calc(100% - 80px);top:0">.60 (18)</div>
  </div>
</div>
</body></html>
